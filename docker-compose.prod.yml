services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novalup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-product_photos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novalup} -d ${POSTGRES_DB:-product_photos}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - internal

  product-photos:
    build:
      context: .
      dockerfile: apps/product-photos/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novalup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-product_photos}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KIE_API_KEY: ${KIE_API_KEY}
      KIE_BASE_URL: ${KIE_BASE_URL:-https://api.kie.ai}
      KIE_MODEL: ${KIE_MODEL:-nano-banana-2}
      KIE_RESOLUTION: ${KIE_RESOLUTION:-2K}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-duz1soadb}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-product-photos}
      FORMSUBMIT_EMAIL: ${FORMSUBMIT_EMAIL}
      FREE_CREDITS: ${FREE_CREDITS:-3}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    networks:
      - internal
      - dokploy-network

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  pgdata: {}